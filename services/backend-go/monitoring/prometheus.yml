# Local host-process example. Change targets for your deployment network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [alerts.yml]
scrape_configs:
  - job_name: tickergarden-api
    static_configs:
      - targets: ['127.0.0.1:8790']
  # A separate blackbox exporter performs GET /readyz; /metrics does not probe.
  - job_name: tickergarden-readiness-probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://127.0.0.1:8790/readyz']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: '127.0.0.1:9115'
