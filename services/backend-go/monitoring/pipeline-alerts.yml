groups:
  - name: tickergarden-pipeline
    rules:
      - alert: TickerGardenPipelineCollectorDown
        expr: up{job="tickergarden-pipeline"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "TickerGarden pipeline collector cannot be scraped"}
      - alert: TickerGardenPipelineMetricsMissing
        expr: |
          (up{job="tickergarden-pipeline"} == 1 unless on (job, instance) tickergarden_pipeline_observed_timestamp_seconds{job="tickergarden-pipeline"})
          or (up{job="tickergarden-pipeline"} == 1 unless on (job, instance) tickergarden_pipeline_attention{job="tickergarden-pipeline"})
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "TickerGarden pipeline scrape lacks required status metrics"}
      - alert: TickerGardenPipelineStale
        expr: time() - tickergarden_pipeline_observed_timestamp_seconds{job="tickergarden-pipeline"} > 300
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "TickerGarden pipeline report is older than five minutes"}
      - alert: TickerGardenPipelineClockSkew
        expr: tickergarden_pipeline_observed_timestamp_seconds{job="tickergarden-pipeline"} - time() > 30
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "TickerGarden pipeline report timestamp is in the future"}
      - alert: TickerGardenPipelineAttention
        expr: |
          (tickergarden_pipeline_attention{job="tickergarden-pipeline"} == 1)
          and on (job, instance, chain_id) (time() - tickergarden_pipeline_observed_timestamp_seconds{job="tickergarden-pipeline"} <= 300)
          and on (job, instance, chain_id) (tickergarden_pipeline_observed_timestamp_seconds{job="tickergarden-pipeline"} - time() <= 30)
          and on (job, instance) (up{job="tickergarden-pipeline"} == 1)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "TickerGarden pipeline reports an active attention signal"}
