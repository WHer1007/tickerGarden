<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User activity UI fixture</title><link rel="stylesheet" href="../../subpages.css"></head><body><main class="page"><h1>User activity UI fixture</h1><p>Synthetic data for component verification.</p><div class="form-actions"><button id="a">Wallet A</button><button id="b">Wallet B</button><button id="stop">Disconnect</button><button id="new">New history</button><button id="fail">Unavailable</button><button id="restore">Restore API</button></div><section class="panel"><h2>Wallet activity</h2><p>Finalized events referencing the wallet. Roles do not establish who initiated a transaction. Event details use raw units.</p><div data-user-activity></div></section></main><script type="module">
import {mountUserActivity} from '../../src/v1/userActivityWidget.ts';
const hash=n=>'0x'+n.toString(16).padStart(64,'0');
const a='0x'+'1'.repeat(40),b='0x'+'2'.repeat(40);
const record=(n,account)=>({id:`4663:${hash(n)}:${hash(n+10)}:0:${account}`,chainId:4663,account,roles:['user'],identityBasis:'event_address_reference_not_verified_initiator',module:'UserStockVault',signature:'StockDeposited(bytes32,address,uint256)',emitter:'0x'+'3'.repeat(40),blockNumber:String(n),blockHash:hash(n),transactionHash:hash(n+10),transactionIndex:'0',logIndex:'0',arguments:{assetUid:hash(21),user:account,amount:'1234567890123456789012345678901234567890'}});
let latest=3, unavailable=false;
globalThis.fetch=async input=>{if(unavailable)return new Response("Unavailable",{status:503});const url=new URL(input);if(url.searchParams.has('cursor'))return new Response(JSON.stringify({error:'activity_page_changed',message:'Changed fixture',requestId:'fixture'}),{status:409});const account=url.pathname.split('/')[3];return new Response(JSON.stringify({chainId:4663,account,items:[record(latest,account),record(latest-1,account)],nextCursor:'fixture-cursor',indexedFrom:'1',sourceBlockNumber:String(latest),sourceBlockHash:hash(latest),revision:'sha256:'+String(latest).repeat(64),finality:'finalized',observedAt:'2026-09-07T00:00:00Z',displayOnly:true}));};
const widget=mountUserActivity(document.querySelector('[data-user-activity]'),'https://fixture.invalid',4663);
document.querySelector('#new').onclick=()=>{latest=4;};document.querySelector('#fail').onclick=()=>{unavailable=true;};document.querySelector('#restore').onclick=()=>{unavailable=false;widget.refresh();};
document.querySelector('#a').onclick=()=>widget.setContext(a,true);document.querySelector('#b').onclick=()=>widget.setContext(b,true);document.querySelector('#stop').onclick=()=>widget.setContext(null,true);widget.setContext(a,true);
</script></body></html>
