<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Token detail integration fixture — not live</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/subpages.css"><body><div style="padding:10px 28px;background:#fff0ce;font:12px Arial">Controlled integration fixture — not live market data. <button id="normal">Valid response</button> <button id="stale">Stale response</button> <button id="slow">Slow A</button> <button id="switch">Market B</button><span id="requests"></span></div><div id="outlet"></div><script type="module">
import page from '/src/pages/trade.ts';import {mountTokenDetail} from '/src/v1/tokenDetailWidget.ts';
const root=document.querySelector('#outlet');root.innerHTML=page.html;let mode='normal',calls=0;
const id=n=>({marketId:'0x'+String(n).repeat(64),memeToken:'0x'+String(n).repeat(40),quoteAsset:'0x'+'3'.repeat(40),quoteDecimals:18,symbol:n===1?'GARDEN':'BETA',quoteSymbol:'ETH'});
window.fetch=async input=>{const u=new URL(input),chosen=mode,identity=u.pathname.includes(id(2).marketId)?id(2):id(1),period=u.searchParams.get('period');document.querySelector('#requests').textContent=`Requests: ${++calls}`;if(chosen==='slow')await new Promise(r=>setTimeout(r,1500));const now=Math.floor(Date.now()/1000),interval=({'1H':60,'12H':300,'1D':900})[period],to=Math.floor(now/interval)*interval,from=to-interval*60;const duration=({'1H':3600,'12H':43200,'1D':86400})[period],start=to-duration;
const src={provider:'dune',asOf:chosen==='stale'?now-3600:now,blockNumber:'100',blockHash:'0x'+'4'.repeat(64),queryId:'42',executionId:'fixture-only',cachedAt:now};const keys=['statistics','chart','trades','holders','fees'];
return new Response(JSON.stringify({version:1,chainId:46630,displayOnly:true,...identity,period,statistics:{price:'0.0000283',volume24h:'86.4',volumeFrom:now-86400,volumeTo:now,volumeBasis:'EXTERNAL_EXECUTIONS_CURVE_EXCLUDING_FEE_TAX_OR_POOL_CORE'},chart:{from:start,to,interval,points:Array.from({length:(to-start)/interval},(_,i)=>({timestamp:start+i*interval,price:i===4?null:(0.00002+i/10000000).toFixed(8)}))},trades:Array.from({length:15},(_,i)=>({timestamp:now-i*120,side:i%2?'sell':'buy',price:'0.0000283',memeRaw:'12500000000000000000000',quoteRaw:'353750000000000000',actor:'0x'+'5'.repeat(40),txHash:'0x'+(i+1).toString(16).padStart(64,'0'),eventKey:String(i),classification:'unclassified'})),holders:{totalSupplyRaw:'1000000000000000000000000000',circulatingSupplyRaw:'600000000000000000000000000',count:1284,basis:'TOTAL_MINUS_KNOWN_PROTOCOL_BALANCES_V1',items:Array.from({length:12},(_,i)=>({account:'0x'+(i+10).toString(16).padStart(40,'0'),balanceRaw:String(12000000-i*1000000)+'000000000000000000'}))},fees:[{recipient:'creator',asset:identity.quoteAsset,amountRaw:'8400000000000000000'},{recipient:'stakers',asset:identity.quoteAsset,amountRaw:'6300000000000000000'},{recipient:'platform',asset:identity.quoteAsset,amountRaw:'6300000000000000000'}],sources:Object.fromEntries(keys.map(k=>[k,src])),reasons:{}}),{headers:{'content-type':'application/json'}});};
const widget=mountTokenDetail(root,location.origin,46630,'https://example.com');
function select(n,m){mode=m;const i=id(n);root.querySelectorAll('[data-detail-symbol]').forEach(e=>e.textContent=i.symbol);root.querySelector('[data-trade-market-name]').textContent=n===1?'Garden token':'Beta token';root.querySelector('[data-detail-description]').textContent='Controlled content to verify the approved layout, data binding and chart states.';root.querySelector('[data-detail-supply]').textContent='1,000,000,000';root.querySelector('[data-detail-token]').textContent=i.memeToken.slice(0,6)+'…'+i.memeToken.slice(-4);root.querySelector('[data-detail-created]').textContent='Sep 8, 2026';root.querySelector('[data-detail-creator]').textContent='0x1234…5678';widget.setMarket(i);widget.setFeeConfig({phase:1,stakingEnabled:true,active:true,holders:false,taxBps:0});}
for(const button of root.querySelectorAll('[data-trade-side]'))button.onclick=()=>{root.querySelector('[data-trade-form]').dataset.refMode=button.dataset.tradeSide;root.querySelectorAll('[data-trade-side]').forEach(b=>{b.classList.toggle('active',b===button);b.setAttribute('aria-pressed',String(b===button));});};
for(const button of root.querySelectorAll('[data-detail-tab]'))button.onclick=()=>{root.querySelectorAll('[data-detail-tab]').forEach(b=>{b.classList.toggle('active',b===button);b.setAttribute('aria-selected',String(b===button));});root.querySelectorAll('[data-detail-panel]').forEach(p=>p.hidden=p.dataset.detailPanel!==button.dataset.detailTab);};
document.querySelector('#normal').onclick=()=>select(1,'normal');document.querySelector('#stale').onclick=()=>select(1,'stale');document.querySelector('#slow').onclick=()=>select(1,'slow');document.querySelector('#switch').onclick=()=>select(2,'normal');select(1,'normal');
</script></body></html>
