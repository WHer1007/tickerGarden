<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Candle component verification</title><style>body{font:16px system-ui;background:#faf9f4;color:#23331c;margin:20px}main{max-width:800px;margin:auto;min-width:0}section{padding:16px;border:1px solid #ccd1c5;border-radius:16px}button{padding:10px;margin:8px}svg{display:block}details{margin:16px 0}</style><main><h1>Candle component fixture</h1><p>Controlled data; not live market evidence.</p><button id="normal">Trades</button><button id="empty">No trades</button><button id="error">Unavailable</button><section id="chart"><h2>Price history</h2></section></main><script type="module">
import {mountCandles} from '/src/v1/candleWidget.ts';
const id={marketId:'0x'+'1'.repeat(64),memeAsset:'0x'+'2'.repeat(40),quoteAsset:'0x'+'3'.repeat(40),quoteDecimals:6};let mode='normal';
window.fetch=async input=>{if(mode==='error')return new Response('{}',{status:503});const u=new URL(input),from=Number(u.searchParams.get('from')),to=Number(u.searchParams.get('to'));const p=n=>({numerator:String(n),denominator:'100'});return new Response(JSON.stringify({chainId:4663,displayOnly:true,...id,interval:3600,coverage:{from,to,anchorNumber:1,throughNumber:100,projectionNumber:101,anchorHash:id.marketId,throughHash:id.marketId,projectionHash:id.marketId},series:{priceUnit:'QUOTE_PER_WHOLE_MEME',volumeBasis:'CURVE_EXCLUDING_FEE_TAX_OR_POOL_CORE',pricePopulation:'ALL_EXECUTIONS_INCLUDING_INTERNAL_CONVERSIONS',emptyPolicy:'NULL_OHLC_ZERO_VOLUME',candles:Array.from({length:24},(_,i)=>{const active=mode==='normal'&&i%4!==0;return {timestamp:from+i*3600,open:active?p(100+i):null,close:active?p(102+i):null,high:active?p(104+i):null,low:active?p(98+i):null,memeVolumeRaw:active?'1000000000000000000':'0',quoteVolumeRaw:active?'1000000':'0',internalMemeVolumeRaw:'0',internalQuoteVolumeRaw:'0',tradeCount:active?1:0,internalTradeCount:0,unclassifiedTradeCount:active?1:0}})}}),{headers:{'content-type':'application/json'}})};
const widget=mountCandles(document.querySelector('#chart'),location.origin,4663);widget.setMarket(id);for(const m of ['normal','empty','error'])document.getElementById(m).onclick=()=>{mode=m;widget.setMarket(id)};
</script></html>
