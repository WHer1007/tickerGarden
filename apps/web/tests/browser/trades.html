<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trade component verification</title><style>body{font:16px system-ui;background:#faf9f4;color:#23331c;margin:20px}main{max-width:1000px;margin:auto;min-width:0}section{padding:16px;border:1px solid #ccd1c5;border-radius:16px}button{padding:10px;margin:8px}table{text-align:left}</style><main><h1>Trade component fixture</h1><p>Controlled data; not live market evidence.</p><button id="normal">Market A</button><button id="stale">Expire next page</button><button id="slow">Slow market A</button><button id="switch">Market B</button><p id="selected">Market A</p><section id="history"><h2>Recent executions</h2></section></main><script type="module">
import {mountTrades} from '/src/v1/tradeWidget.ts';
const identity=n=>({marketId:'0x'+String(n).repeat(64),memeAsset:'0x'+'2'.repeat(40),quoteAsset:'0x'+'3'.repeat(40),quoteDecimals:18});let mode='normal';
window.fetch=async input=>{const u=new URL(input),captured=mode,market=u.pathname.includes(identity(4).marketId)?4:1,from=Number(u.searchParams.get('from')),to=Number(u.searchParams.get('to')),page=u.searchParams.has('cursor');if(captured==='slow')await new Promise(r=>setTimeout(r,2000));if(captured==='stale'&&page)return new Response(JSON.stringify({error:'trade_page_changed',message:'restart',requestId:'fixture'}),{status:409});const id=identity(market),count=page?1:50,offset=page?50:0;return new Response(JSON.stringify({chainId:4663,displayOnly:true,...id,coverage:{from,to,anchorNumber:1,throughNumber:1000,projectionNumber:1001,anchorHash:id.marketId,throughHash:id.marketId,projectionHash:id.marketId},revision:'sha256:'+String(market).repeat(64),items:Array.from({length:count},(_,i)=>{const n=100-offset-i,tx='0x'+n.toString(16).padStart(64,'0');return {source:{chainId:4663,blockNumber:String(n),blockHash:tx,transactionHash:tx,transactionIndex:0,logIndex:0,emitter:id.memeAsset,eventKey:`4663:${tx}:0`},venue:'pool',marketId:id.marketId,timestamp:String(from+100),side:'sell',classification:'internal_reward_conversion',actor:null,recipient:null,actorConfidence:'unavailable',memeAsset:id.memeAsset,quoteAsset:id.quoteAsset,quoteDecimals:18,memeRaw:'1000000000000000000',quoteRaw:market===1?'10000000000000000000':'20000000000000000000',price:{numerator:market===1?'10':'20',denominator:'1'},priceUnit:'QUOTE_PER_WHOLE_MEME',amountBasis:'POOL_CORE',feeRaw:null,feeAsset:null,taxRaw:null,feeStatus:'not_provided'}}),nextCursor:page?null:'page-two'}),{headers:{'content-type':'application/json'}})};
const widget=mountTrades(document.querySelector('#history'),location.origin,4663);widget.setMarket(identity(1));
const select=(n,m)=>{mode=m;document.querySelector('#selected').textContent=n===1?'Market A':'Market B';widget.setMarket(identity(n));};
document.querySelector('#normal').onclick=()=>select(1,'normal');document.querySelector('#stale').onclick=()=>{mode='stale'};document.querySelector('#slow').onclick=()=>select(1,'slow');document.querySelector('#switch').onclick=()=>select(4,'normal');
</script></html>
