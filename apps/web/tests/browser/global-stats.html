<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global statistics verification</title>
<style>body{font:16px system-ui;background:#fbfaf3;color:#25382b;margin:20px}section{padding:20px;border:1px solid #ccc;max-width:1000px}button{padding:10px;margin:4px}article{border-bottom:1px solid #ccc}</style>
<button id="normal">Normal</button><button id="empty">Empty</button><button id="unavailable">Unavailable</button><section id="stats" data-expanded><h2>Global execution statistics</h2></section>
<script type="module">
import {mountGlobalStatistics} from '/src/v1/globalStatsWidget.ts';
let mode='normal',widget;const hash=n=>'0x'+n.toString(16).padStart(64,'0'),address=n=>'0x'+n.toString(16).padStart(40,'0');
window.fetch=async input=>{if(mode==='unavailable')return new Response('{}',{status:503});const q=new URL(String(input)).searchParams;const empty=mode==='empty';return new Response(JSON.stringify({chainId:4663,displayOnly:true,coverage:{from:Number(q.get('from')),to:Number(q.get('to')),anchorNumber:1,anchorHash:hash(1),throughNumber:2,throughHash:hash(2),projectionNumber:3,projectionHash:hash(3)},marketCount:empty?0:1,registeredStockCount:1,boundMarketCount:empty?0:1,unboundMarketCount:0,stocks:[{assetUid:hash(1),stockToken:address(1),stockDecimals:8}],groups:empty?[]:[{assetUid:hash(1),binding:'registered_stock',quoteAsset:address(2),quoteDecimals:6,marketCount:1,tradingMarketCount:1,tradeCount:2,internalTradeCount:1,unclassifiedTradeCount:1,unknownFeeTradeCount:1,quoteVolumeRaw:'3000000',internalQuoteVolumeRaw:'1000000',volumeBasis:'CURVE_EXCLUDING_FEE_TAX_OR_POOL_CORE',fees:[{asset:address(2),decimals:6,feeRaw:'5',taxRaw:'2'}]}]}));};
const panel=document.querySelector('#stats');function render(){widget?.stop();panel.replaceChildren();widget=mountGlobalStatistics(panel,'http://fixture.test',4663);}for(const m of ['normal','empty','unavailable'])document.getElementById(m).onclick=()=>{mode=m;render();};render();
</script>
