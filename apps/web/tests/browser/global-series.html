<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global series verification</title><style>body{font:15px system-ui;margin:20px;background:#fbfaf3;color:#25382b}section{border:1px solid #ccc;padding:18px;max-width:1100px}button,select{padding:9px;margin:4px}td,th{border-bottom:1px solid #ccc}</style><button id="normal">Normal</button><button id="unavailable">Unavailable</button><section id="series"></section>
<script type="module">
import {mountGlobalSeries} from '/src/v1/globalSeriesWidget.ts';let mode='normal',widget;const hash=n=>'0x'+n.toString(16).padStart(64,'0'),address=n=>'0x'+n.toString(16).padStart(40,'0');
window.fetch=async input=>{if(mode==='unavailable')return new Response('{}',{status:503});const q=new URL(String(input)).searchParams,from=Number(q.get('from')),to=Number(q.get('to'));return new Response(JSON.stringify({chainId:4663,displayOnly:true,interval:3600,volumeBasis:'CURVE_EXCLUDING_FEE_TAX_OR_POOL_CORE',emptyPolicy:'ZERO_FLOW_NO_SYNTHETIC_EXECUTIONS',coverage:{from,to,anchorNumber:1,anchorHash:hash(1),throughNumber:2,throughHash:hash(2),projectionNumber:3,projectionHash:hash(3)},points:Array.from({length:24},(_,i)=>({timestamp:from+i*3600,groups:[2,3].map(n=>({assetUid:hash(1),binding:'registered_stock',quoteAsset:address(n),quoteDecimals:n===2?6:18,tradeCount:i===n?1:0,internalTradeCount:i===n&&n===2?1:0,unclassifiedTradeCount:i===n&&n===3?1:0,unknownFeeTradeCount:i===n?1:0,quoteVolumeRaw:i===n?(n===2?'3000000':'1000000000000000001'):'0',internalQuoteVolumeRaw:i===n&&n===2?'3000000':'0',fees:[]}))}))}));};
function render(){widget?.stop();const panel=document.querySelector('#series');panel.replaceChildren();widget=mountGlobalSeries(panel,'http://fixture.test',4663);}document.querySelector('#normal').onclick=()=>{mode='normal';render();};document.querySelector('#unavailable').onclick=()=>{mode='unavailable';render();};render();
</script>
