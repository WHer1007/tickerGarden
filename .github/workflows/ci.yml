name: TickerGarden V1

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boundary-and-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Check environment isolation
        run: npm run test:environment
      - name: Verify V1 source boundary
        run: npm run check:boundary
      - name: Verify V1 machine specification
        run: npm run test:spec

  contracts-interface-and-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Restore pinned contract dependencies
        working-directory: contracts
        run: node scripts/sync-dependencies.mjs
      - name: Check V1 formatting
        working-directory: contracts
        run: forge fmt --profile v1-ci --check src/v1 test/v1
      - name: Build isolated V1 namespace
        working-directory: contracts
        run: forge build --profile v1-ci
      - name: Test isolated V1 namespace
        working-directory: contracts
        run: forge test --profile v1-ci
      - name: Verify clean-cache invariant and coverage reproducibility
        working-directory: contracts
        run: |
          forge clean --profile v1-ci
          forge test --profile v1-ci --no-cache --match-path 'test/v1/product/VaultGaugeInvariant.t.sol' 2>&1 | tee "$RUNNER_TEMP/v1-invariant-clean.log"
          if grep -q 'Failure from ' "$RUNNER_TEMP/v1-invariant-clean.log"; then
            echo 'stale invariant counterexample was consumed after a clean build'
            exit 1
          fi
          forge test --profile v1-ci --match-path 'test/v1/product/VaultGaugeInvariant.t.sol' 2>&1 | tee "$RUNNER_TEMP/v1-invariant-cached.log"
          if grep -q 'Failure from ' "$RUNNER_TEMP/v1-invariant-cached.log"; then
            echo 'cached V1 invariant run consumed a stale counterexample'
            exit 1
          fi
          # Keep coverage on the representative curve suite: it exercises the
          # V1 pricing/asset-accounting path without exact bytecode/gas checks
          # that are intentionally incompatible with coverage's IR build.
          forge coverage --profile v1-ci --no-cache --ir-minimum \
            --match-path 'test/v1/product/PonsCompatibleCurve.t.sol' --report summary
      - name: Verify generated interfaces and compiled ABI manifest
        run: npm run check:interfaces

  v1-holder-rewards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Restore pinned contract dependencies
        working-directory: contracts
        run: node scripts/sync-dependencies.mjs
      - name: Install pinned test encoder dependencies
        working-directory: apps/web
        run: npm ci
      - name: Check V1 Holder rewards formatting
        working-directory: contracts
        run: forge fmt --profile v1-ci --check src/v1 test/v1/treasury
      - name: Build V1 Holder rewards namespace
        working-directory: contracts
        run: forge build --profile v1-ci
      - name: Test V1 Holder rewards subsystem
        working-directory: contracts
        run: forge test --profile v1-ci --match-path 'test/v1/treasury/**'
      - name: Verify V1 Holder rewards invariant without cache
        working-directory: contracts
        run: forge test --profile v1-ci --no-cache --match-path 'test/v1/treasury/product/HolderBatchedInvariant.t.sol'
      - name: Check current reward paths and worker policy
        run: npm run test:current-rewards && npm run test:holder-worker


  contracts-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Restore pinned contract dependencies
        working-directory: contracts
        run: node scripts/sync-dependencies.mjs
      - name: Build before product artifact inventory
        working-directory: contracts
        run: FOUNDRY_PROFILE=v1 forge build
      - name: Report or run V1 product tests
        run: npm run check:product-track

  contracts-fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Restore pinned contract dependencies
        working-directory: contracts
        run: node scripts/sync-dependencies.mjs
      - name: Report or run V1 fork tests
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
        run: npm run check:fork-track

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: deployments/package-lock.json
      - name: Install
        working-directory: deployments
        run: npm ci
      - name: Build
        working-directory: deployments
        run: npm run build
      - name: Test
        working-directory: deployments
        run: npm test
      - name: Report V1 deployment-track status
        run: npm run check:deployment-track

  typescript-serverless-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tickergarden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/backend-ts/package-lock.json
      - name: Install TypeScript backend
        working-directory: services/backend-ts
        run: npm ci
      - name: Verify generated contracts, types, unit tests and build
        working-directory: services/backend-ts
        run: npm test && npm run build
      - name: Run PostgreSQL integration tests
        working-directory: services/backend-ts
        env:
          TG_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tickergarden
        run: npm run test:integration && npm run test:recovery

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Build frontend
        working-directory: apps/web
        run: npm run build
      - name: Test frontend
        working-directory: apps/web
        run: npm test
