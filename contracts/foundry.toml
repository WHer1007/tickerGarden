[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false

[profile.v2]
src = "src/v2"
test = "test/v2"
script = "script/v2"
out = "out-v2"
cache_path = "cache-v2"
libs = ["lib"]
fs_permissions = [{ access = "read", path = "../spec" }]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false

[profile.ci]
fuzz = { runs = 1_000 }
invariant = { runs = 256, depth = 64, fail_on_revert = true }
